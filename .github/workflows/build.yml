name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Unzip Project
        run: |
          unzip project.zip -d ./
          rm project.zip

      # 核心魔法：直接重写 settings.gradle.kts，注入 Token 认证
      - name: Rewrite settings.gradle.kts
        env:
          MIUIX_TOKEN: ${{ secrets.MIUIX_TOKEN }}
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
                  maven {
                      url = uri("https://maven.pkg.github.com/compose-miuix-ui/miuix")
                      credentials {
                          username = "TakiShiina-BA"
                          password = System.getenv("MIUIX_TOKEN")
                      }
                      content {
                          includeGroup("top.yukonga.miuix.kmp")
                      }
                  }
              }
          }
          rootProject.name = "KeiOS"
name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Unzip Project
        run: |
          unzip project.zip -d ./
          rm project.zip

      # 1. 重写 settings 注入 Token
      - name: Rewrite settings.gradle.kts
        env:
          MIUIX_TOKEN: ${{ secrets.MIUIX_TOKEN }}
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
                  maven {
                      url = uri("https://maven.pkg.github.com/compose-miuix-ui/miuix")
                      credentials {
                          username = "TakiShiina-BA"
                          password = System.getenv("MIUIX_TOKEN")
                      }
                      content {
                          includeGroup("top.yukonga.miuix.kmp")
                      }
                  }
              }
          }
          rootProject.name = "KeiOS"
          includeBuild("build-logic")
          include(":app")
          include(":baselineprofile")
          include(":core-concurrency")
          include(":core-download")
          include(":core-io")
          include(":core-json")
          include(":core-log")
          include(":core-notification")
          include(":core-prefs")
          include(":core-system")
          include(":core-versioning")
          include(":feature-ba")
          include(":feature-github")
          include(":feature-github-engine")
          include(":feature-home")
          include(":feature-keepalive")
          include(":feature-mcp")
          include(":feature-os")
          include(":feature-webdav")
          include(":ui-liquid-glass")
          include(":ui-pip")
          EOF
          
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/agp = "9.5.0-rc01"/agp = "8.5.0"/g' gradle/libs.versions.toml
          fi

      # 2. 核心补丁：把报错的 compileOptions 代码注释掉
      - name: Patch build-logic errors
        run: |
          FILE="build-logic/src/main/kotlin/os/kei/buildlogic/AndroidConventions.kt"
          if [ -f "$FILE" ]; then
            # 把 compileOptions 替换为默认（因为降级后找不到扩展）
            sed -i 's/compileOptions {/\/\/ compileOptions {/g' $FILE
            sed -i 's/sourceCompatibility/\/\/ sourceCompatibility/g' $FILE
            sed -i 's/targetCompatibility/\/\/ targetCompatibility/g' $FILE
            # 注释掉由于修改产生的多余右括号
            sed -i 's/^            }$/            \/\/ }/g' $FILE
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
