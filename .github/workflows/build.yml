name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: |
          unzip project.zip -d ./
          rm project.zip

      # 只做一件事：把 Miuix 的 Token 注入进去，其他全用原版
      - name: Inject Miuix Token
        env:
          MIUIX_TOKEN: ${{ secrets.MIUIX_TOKEN }}
        run: |
          # 注意：这里我们不再覆盖任何文件，只用 sed 在指定位置插入 Token
          sed -i '/url = uri("https:\/\/maven.pkg.github.com\/compose-miuix-ui\/miuix")/a\            credentials {\n                username = "TakiShiina-BA"\n                password = System.getenv("MIUIX_TOKEN")\n            }' settings.gradle.kts
          
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
