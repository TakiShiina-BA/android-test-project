name: Build APK
on: workflow_dispatch

# 关键1：赋予系统自带 Token 读取 Packages 的权限
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip project.zip -d ./
          rm project.zip

      - name: Inject Miuix Token (GITHUB_TOKEN)
        run: |
          # 关键2：使用系统自带的 GITHUB_ACTOR 和 GITHUB_TOKEN
          sed -i '/url = uri("https:\/\/maven.pkg.github.com\/compose-miuix-ui\/miuix")/a\            credentials {\n                username = System.getenv("GITHUB_ACTOR")\n                password = System.getenv("GITHUB_TOKEN")\n            }' settings.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        env:
        
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
