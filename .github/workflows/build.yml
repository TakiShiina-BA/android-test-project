name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Patch
        env:
          MIUIX_TOKEN: ${{ secrets.MIUIX_TOKEN }}
        run: |
          unzip project.zip -d ./
          rm project.zip
          
          # 1. 降级 AGP 防止找不到 9.5.0 版本
          sed -i 's/agp = "9.5.0-rc01"/agp = "8.5.0"/g' gradle/libs.versions.toml
          
          # 2. 给 Miuix 仓库注入 Token (直接在 url 那行下面插入认证)
          sed -i '/url = uri("https:\/\/maven.pkg.github.com\/compose-miuix-ui\/miuix")/a\            credentials {\n                username = "TakiShiina-BA"\n                password = System.getenv("MIUIX_TOKEN")\n            }' settings.gradle.kts
          
          # 3. 删掉导致报错的 compileOptions（直接删掉那个代码块）
          sed -i '/compileOptions {/,/}/d' build-logic/src/main/kotlin/os/kei/buildlogic/AndroidConventions.kt
          
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
